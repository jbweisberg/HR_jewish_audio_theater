name: JAT Universal Handoff Polish
on:
  push:
    branches: [jat]
    paths: ['.github/workflows/jat-polish2.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jat
      - name: Update JAT handoff copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("<span className=\"bedtime-kicker\">The story is almost over</span>", "<span className=\"bedtime-kicker\">The next adventure awaits</span>")
          s = s.replace("<h2>{upNext ? 'If they’re still awake…' : 'Still awake?'}</h2>", "<h2>Where will Jewish Audio Theater take you next?</h2>")
          s = s.replace("<p>Choose what should come next if they are still awake. While this story is still playing, your choice is queued and waits for a natural ending.</p>", "<p>Continue the adventure with the next chapter, or step into a whole new story.</p>")
          s = s.replace("index === 0 && !upNext ? 'Another Story' : 'Choose Another Story'", "index === 0 && !upNext ? 'New Adventure' : 'Discover Another Story'")
          s = s.replace("If they’re asleep, do nothing. Nothing else will start. If you choose a story, JAT will use a conservative silence handoff when available and otherwise wait for the file’s true end.", "No choice? The curtain falls here. Nothing else will play.")
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "jbweisberg"
          git config user.email "jbweisberg@gmail.com"
          git add src/App.tsx
          git commit -m "JAT: universalize story handoff"
          git push origin HEAD:jat
