name: JAT Final Experience Polish

on:
  push:
    branches:
      - jat
    paths:
      - .github/workflows/jat-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out jat
        uses: actions/checkout@v4
        with:
          ref: jat

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply JAT polish
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          source = path.read_text()

          replacements = []

          replacements.append((
          """  const loadCatalog = async (force = false) => {
    setLoadError(false);
    if (!force) {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const parsed = JSON.parse(cached) as { savedAt: number; episodes: Episode[] };
          if (Date.now() - parsed.savedAt < CACHE_TTL && parsed.episodes?.length) {
            setEpisodes(parsed.episodes);
            setLoading(false);
          }
        }
      } catch {
        localStorage.removeItem(CACHE_KEY);
      }
    }

    try {
      const response = await fetch(FEED_URL, { headers: { Accept: 'application/rss+xml, text/xml' } });
      if (!response.ok) throw new Error('Feed request failed');
      const xml = await response.text();
      const parsed = parseFeed(xml);
      if (!parsed.length) throw new Error('No productions found');
      setEpisodes(parsed);
      localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), episodes: parsed }));
      setLoading(false);
    } catch {
      setLoading(false);
      setLoadError(true);
    }
  };
""",
          """  const loadCatalog = async (force = false) => {
    setLoadError(false);
    let cachedEpisodes: Episode[] = [];

    if (!force) {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const parsed = JSON.parse(cached) as { savedAt: number; episodes: Episode[] };
          if (Date.now() - parsed.savedAt < CACHE_TTL && parsed.episodes?.length) {
            cachedEpisodes = parsed.episodes;
          }
        }
      } catch {
        localStorage.removeItem(CACHE_KEY);
      }
    }

    try {
      const response = await fetch(FEED_URL, { headers: { Accept: 'application/rss+xml, text/xml' } });
      if (!response.ok) throw new Error('Feed request failed');
      const xml = await response.text();
      const parsed = parseFeed(xml);
      if (!parsed.length) throw new Error('No productions found');
      setEpisodes(parsed);
      localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), episodes: parsed }));
      setLoading(false);
    } catch {
      if (cachedEpisodes.length) {
        setEpisodes(cachedEpisodes);
        setLoading(false);
        setLoadError(false);
      } else {
        setLoading(false);
        setLoadError(true);
      }
    }
  };
""",
          'catalog cache'))

          replacements.append((
          """  const audioRef = useRef<HTMLAudioElement | null>(null);
  const queuedEpisodeRef = useRef<Episode | null>(null);
""",
          """  const audioRef = useRef<HTMLAudioElement | null>(null);
  const chimeContextRef = useRef<AudioContext | null>(null);
  const queuedEpisodeRef = useRef<Episode | null>(null);
""",
          'chime context ref'))

          replacements.append((
          """  const playParentChime = () => {
    try {
      const AudioContextClass = window.AudioContext || (window as typeof window & { webkitAudioContext?: typeof AudioContext }).webkitAudioContext;
      if (!AudioContextClass) return;
      const context = new AudioContextClass();
      const gain = context.createGain();
      const first = context.createOscillator();
      const second = context.createOscillator();
      const now = context.currentTime;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.018, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
      first.frequency.setValueAtTime(784, now);
      second.frequency.setValueAtTime(1174.66, now);
      first.type = 'sine';
      second.type = 'sine';
      first.connect(gain);
      second.connect(gain);
      gain.connect(context.destination);
      first.start(now);
      second.start(now + 0.08);
      first.stop(now + 0.5);
      second.stop(now + 0.7);
      window.setTimeout(() => void context.close(), 900);
    } catch {
      // The story must never be interrupted because a notification tone failed.
    }
  };
""",
          """  const unlockParentChime = async () => {
    try {
      const AudioContextClass = window.AudioContext || (window as typeof window & { webkitAudioContext?: typeof AudioContext }).webkitAudioContext;
      if (!AudioContextClass) return;

      let context = chimeContextRef.current;
      if (!context || context.state === 'closed') {
        context = new AudioContextClass();
        chimeContextRef.current = context;
      }
      if (context.state === 'suspended') await context.resume();
    } catch {
      // The story remains fully usable even if the browser blocks the cue.
    }
  };

  const playParentChime = () => {
    try {
      const context = chimeContextRef.current;
      if (!context || context.state !== 'running') return;

      const gain = context.createGain();
      const first = context.createOscillator();
      const second = context.createOscillator();
      const now = context.currentTime;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.032, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.78);
      first.frequency.setValueAtTime(659.25, now);
      second.frequency.setValueAtTime(987.77, now);
      first.type = 'sine';
      second.type = 'sine';
      first.connect(gain);
      second.connect(gain);
      gain.connect(context.destination);
      first.start(now);
      second.start(now + 0.11);
      first.stop(now + 0.55);
      second.stop(now + 0.78);
      window.setTimeout(() => {
        try { gain.disconnect(); } catch { /* already disconnected */ }
      }, 1000);
    } catch {
      // The story must never be interrupted because a notification tone failed.
    }
  };
""",
          'chime implementation'))

          replacements.append((
          """    try {
      await audio.play();
    } catch {
      setIsPlaying(false);
      setPlaybackError(true);
    }
  };

  const togglePlayback = async () => {
""",
          """    try {
      await unlockParentChime();
      await audio.play();
    } catch {
      setIsPlaying(false);
      setPlaybackError(true);
    }
  };

  const togglePlayback = async () => {
""",
          'unlock chime on episode start'))

          replacements.append((
          """    if (audio.paused) {
      try {
        await audio.play();
      } catch {
        setPlaybackError(true);
      }
""",
          """    if (audio.paused) {
      try {
        await unlockParentChime();
        await audio.play();
      } catch {
        setPlaybackError(true);
      }
""",
          'unlock chime on resume'))

          replacements.append((
          """  useEffect(() => () => stopSilenceMonitor(), []);
""",
          """  useEffect(() => () => {
    stopSilenceMonitor();
    const chimeContext = chimeContextRef.current;
    if (chimeContext && chimeContext.state !== 'closed') void chimeContext.close();
  }, []);
""",
          'audio cleanup'))

          replacements.append((
          """                <div className=\"bedtime-handoff-copy\">
                  <span className=\"bedtime-kicker\">The story is almost over</span>
                  <h2>{upNext ? 'If they’re still awake…' : 'Still awake?'}</h2>
                  <p>Choose what should come next if they are still awake. While this story is still playing, your choice is queued and waits for a natural ending.</p>
                </div>
""",
          """                <div className=\"bedtime-handoff-copy\">
                  <span className=\"bedtime-kicker\">The next adventure awaits</span>
                  <h2>Where will Jewish Audio Theater take you next?</h2>
                  <p>Continue the adventure with the next chapter, or step into a whole new story.</p>
                </div>
""",
          'universal handoff headline'))

          replacements.append((
          """                        <span>{isNextChapter ? 'Next Chapter' : index === 0 && !upNext ? 'Another Story' : 'Choose Another Story'}</span>
""",
          """                        <span>{isNextChapter ? 'Next Chapter' : index === 0 && !upNext ? 'New Adventure' : 'Discover Another Story'}</span>
""",
          'handoff card labels'))

          replacements.append((
          """                <div className=\"bedtime-rest-note\">If they’re asleep, do nothing. Nothing else will start. If you choose a story, JAT will use a conservative silence handoff when available and otherwise wait for the file’s true end.</div>
""",
          """                <div className=\"bedtime-rest-note\">No choice? The curtain falls here. Nothing else will play.</div>
""",
          'universal quiet ending'))

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit polished experience
        run: |
          git config user.name "jbweisberg"
          git config user.email "jbweisberg@gmail.com"
          git add src/App.tsx
          git commit -m "JAT: polish handoff, chime, and artwork loading"
          git push origin HEAD:jat
