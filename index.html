<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#050A14', parchment: '#F5F2E8', burgundy: '#4A0E0E', gold: '#D4AF37', alert: '#8B0000' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #050A14; color: #F5F2E8; margin: 0; overflow-x: hidden; width: 100%; }
      html { scroll-behavior: smooth; }
      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #D4AF37; cursor: pointer; border-radius: 50%; border: 2px solid #050A14; }
      
      /* HIGH-INTENSITY RED ALERT VISUAL */
      .final-minute-visual {
        background-color: #8B0000 !important;
        animation: pulse-red 1.5s infinite;
      }
      @keyframes pulse-red {
        0% { opacity: 1; }
        50% { opacity: 0.8; }
        100% { opacity: 1; }
      }
      .countdown-fill { animation: shrink 10s linear forwards; }
      @keyframes shrink { from { width: 100%; } to { width: 0%; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
