<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#02060C', parchment: '#F5F2E8', burgundy: '#4A0E0E', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #02060C; color: #F5F2E8; margin: 0; overflow-x: hidden; }
      html { scroll-behavior: smooth; }
      /* Dimmer Effect */
      .dimmed-theater { filter: brightness(0.4) contrast(0.9); transition: filter 1s ease-in-out; }
      .timer-drain { height: 100%; background: #D4AF37; animation: drain-bar 10s linear forwards; }
      @keyframes drain-bar { from { width: 100%; } to { width: 0%; } }
      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #D4AF37; border-radius: 50%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
