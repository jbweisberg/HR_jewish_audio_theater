<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Addition of Pinyon Script for the JAT Insignia -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;700;900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#02040A', parchment: '#F5F2E8', burgundy: '#4A0404', velvet: '#630606', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'], ornate: ['Pinyon Script', 'cursive'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #02040A; color: #F5F2E8; margin: 0; overflow-x: hidden; width: 100%; }
      html { scroll-behavior: smooth; }
      
      /* THE THEATER DIMMER: Only applies to Stage content */
      .stage-dimmed { filter: brightness(0.2) saturate(0.5); transition: filter 1.5s ease-in-out; pointer-events: none; }

      /* THE VELVET CURTAINS */
      .curtain-panel {
        background: radial-gradient(circle at 50% 50%, #630606 0%, #350202 100%);
        box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 20px 0 50px rgba(0,0,0,0.5);
        background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.1) 45px);
      }
      
      .insignia-gold {
        background: linear-gradient(to bottom, #D4AF37 22%, #F5F2E8 45%, #B8860B 50%, #D4AF37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
      }

      /* TIMER BAR */
      .timer-fill { height: 100%; background: #D4AF37; animation: countdown-fill 10s linear forwards; }
      @keyframes countdown-fill { from { width: 100%; } to { width: 0%; } }

      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #D4AF37; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
