<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- STRICT BRANDING -->
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    <meta name="description" content="Timeless stories brought to life by master storyteller Heshy Riesel.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#050A14', parchment: '#F5F2E8', burgundy: '#4A0E0E', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #050A14; color: #F5F2E8; margin: 0; overflow-x: hidden; width: 100%; }
      html { scroll-behavior: smooth; }
      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #D4AF37; cursor: pointer; border-radius: 50%; border: 2px solid #050A14; }
      
      /* THE FINAL MINUTE PULSE */
      .final-minute-warning { animation: emergency-pulse 2s infinite; }
      @keyframes emergency-pulse { 0% { background-color: #4A0E0E; } 50% { background-color: #8B0000; } 100% { background-color: #4A0E0E; } }
      
      .countdown-bar { animation: countdown-fill 10s linear forwards; }
      @keyframes countdown-fill { from { width: 100%; } to { width: 0%; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
