<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;700;900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#02040A', parchment: '#F5F2E8', burgundy: '#4A0404', velvet: '#630606', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'], ornate: ['Pinyon Script', 'cursive'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #02040A; color: #F5F2E8; margin: 0; overflow-x: hidden; width: 100%; }
      html { scroll-behavior: smooth; }
      
      /* SOLID THEATER DIMMER */
      .stage-hidden { filter: brightness(0.1) blur(10px); pointer-events: none; transition: all 1s ease; }

      /* THE HEAVY VELVET PANEL - 100% Opaque to fix the jumbled bleed-through */
      .velvet-solid {
        background: radial-gradient(circle at 50% 50%, #750808 0%, #350202 100%);
        box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
        border-right: 1px solid rgba(212,175,55,0.2);
        border-left: 1px solid rgba(212,175,55,0.2);
      }
      
      .jat-insignia {
        font-family: 'Pinyon Script', cursive;
        background: linear-gradient(to bottom, #D4AF37 0%, #F5F2E8 50%, #B8860B 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
      }

      /* TIMER BAR */
      .timer-drain { height: 100%; background: #D4AF37; animation: countdown-anim 10s linear forwards; }
      @keyframes countdown-anim { from { width: 100%; } to { width: 0%; } }

      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #D4AF37; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,1); cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
