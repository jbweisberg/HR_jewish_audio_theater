<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;700;900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#02040A', parchment: '#F5F2E8', burgundy: '#4A0404', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'], ornate: ['Pinyon Script', 'cursive'] }
          }
        }
      }
    </script>
    <style>
      /* Clean Slate Base */
      body { background-color: #02040A; color: #F5F2E8; margin: 0; padding: 0; overflow-x: hidden; width: 100%; font-family: 'Inter', sans-serif; }
      html { scroll-behavior: smooth; }

      /* Bedtime Mode: Applies only to Stage Root content */
      .is-bedtime #stage-content { filter: brightness(0.2) blur(10px); transition: all 1.2s ease; pointer-events: none; }
      
      /* REFINED INSIGNIA: Fixed clipping by defining vertical space (leading) and padding */
      .jat-insignia-stage {
        font-family: 'Pinyon Script', cursive;
        font-size: clamp(100px, 20vw, 240px);
        background: linear-gradient(to bottom, #D4AF37 0%, #FFF 40%, #B8860B 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
        line-height: 1.5; /* Essential to prevent vertical clipping */
        padding: 60px 20px; /* Room for script flourishes */
        display: block;
        text-align: center;
      }

      .continuity-bar { height: 100%; background: #D4AF37; animation: countdown-bar 10s linear forwards; }
      @keyframes countdown-bar { from { width: 100%; } to { width: 0%; } }

      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #D4AF37; border-radius: 50%; border: 2px solid #000; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
