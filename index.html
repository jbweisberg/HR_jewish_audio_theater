<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;700;900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#02040A', parchment: '#F5F2E8', burgundy: '#4A0404', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'], ornate: ['Pinyon Script', 'cursive'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #02040A; color: #F5F2E8; margin: 0; overflow-x: hidden; width: 100%; -webkit-tap-highlight-color: transparent; }
      html { scroll-behavior: smooth; }

      /* THE VEIL: This is the dimmer. It sits at Z-1500 */
      #bedtime-veil {
        position: fixed; inset: 0; background: black; opacity: 0; 
        pointer-events: none; transition: opacity 1.2s ease-in-out; z-index: 1500;
      }
      .is-dimmed #bedtime-veil { opacity: 0.9; }
      .is-dimmed #stage-content { filter: blur(5px); transition: filter 1.2s; }

      /* LOGO BOX: Extra padding and height to prevent script clipping */
      .insignia-box {
        min-height: 260px; display: flex; align-items: center; justify-content: center;
        overflow: visible; width: 100%;
      }
      .jat-insignia-text {
        font-family: 'Pinyon Script', cursive;
        font-size: clamp(120px, 25vw, 260px);
        background: linear-gradient(to bottom, #D4AF37 0%, #FFF 50%, #D4AF37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
        padding: 60px 0;
        line-height: 1.8;
      }

      .progress-burn { height: 100%; background: #D4AF37; animation: countdown-burn 10s linear forwards; }
      @keyframes countdown-burn { from { width: 100%; } to { width: 0%; } }

      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #D4AF37; border-radius: 50%; cursor: pointer; border: 3px solid #000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
