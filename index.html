<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;700;900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#02040A', parchment: '#F5F2E8', burgundy: '#4A0404', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'], ornate: ['Pinyon Script', 'cursive'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #02040A; color: #F5F2E8; margin: 0; overflow-x: hidden; width: 100%; }
      html { scroll-behavior: smooth; }
      
      /* Bedtime Mode: Applies only to content background */
      .is-bedtime #stage-root { filter: brightness(0.2) blur(8px); transition: all 1.5s ease-in-out; pointer-events: none; }
      
      .portal-gradient {
        background: radial-gradient(circle at 50% 50%, #250202 0%, #02040A 100%);
        box-shadow: inset 0 0 150px rgba(0,0,0,1);
      }

      /* Logo Size Corrected: Clamp prevents it from growing too big for the screen */
      .jat-logo {
        font-family: 'Pinyon Script', cursive;
        font-size: clamp(80px, 15vw, 160px);
        background: linear-gradient(to bottom, #D4AF37, #FFF, #D4AF37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 0.8;
      }

      .progress-shimmer { height: 100%; background: #D4AF37; animation: countdown-anim 10s linear forwards; }
      @keyframes countdown-anim { from { width: 100%; } to { width: 0%; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
