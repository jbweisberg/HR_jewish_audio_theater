<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;700;900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#02040A', parchment: '#F5F2E8', burgundy: '#4A0404', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'], ornate: ['Pinyon Script', 'cursive'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #02040A; color: #F5F2E8; margin: 0; overflow-x: hidden; width: 100%; -webkit-tap-highlight-color: transparent; }
      html { scroll-behavior: smooth; }
      
      .is-bedtime #theater-stage { filter: brightness(0.15) blur(10px); transition: all 1.5s ease; pointer-events: none; }
      
      /* Insignia styling: Added vertical room (line-height) to prevent cutting letters */
      .portal-insignia {
        font-family: 'Pinyon Script', cursive;
        font-size: clamp(100px, 20vw, 240px);
        background: linear-gradient(to bottom, #D4AF37, #FFF, #D4AF37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.6;
        padding: 40px 0;
        filter: drop-shadow(0 15px 40px rgba(0,0,0,0.9));
        display: block;
      }

      .progress-line { height: 100%; background: #D4AF37; animation: countdown-line 10s linear forwards; }
      @keyframes countdown-line { from { width: 100%; } to { width: 0%; } }

      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #D4AF37; border-radius: 50%; border: 2px solid #000; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
