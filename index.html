<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jewish Audio Theater | Timeless Stories Brought to Life</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              theater: { midnight: '#02040A', parchment: '#F5F2E8', burgundy: '#4A0404', velvet: '#580404', gold: '#D4AF37' }
            },
            fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #02040A; color: #F5F2E8; margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
      html { scroll-behavior: smooth; }
      
      /* THE DIMMER OVERLAY - High Compatibility for Mobile & Desktop */
      #bedtime-overlay {
        position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; z-index: 100;
      }
      .is-dimmed #bedtime-overlay { opacity: 0.85; }

      /* THE VELVET CURTAIN PANELS */
      .curtain-v { 
        background: radial-gradient(circle, #580404 0%, #1a0101 100%); 
        box-shadow: inset 0 0 100px #000; 
      }
      
      .jat-insignia {
        font-style: italic; font-weight: 900;
        background: linear-gradient(to bottom, #D4AF37, #F5F2E8, #D4AF37);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      }

      .progress-shrink { animation: shrink-width 10s linear forwards; }
      @keyframes shrink-width { from { width: 100%; } to { width: 0%; } }

      input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #D4AF37; border-radius: 50%; border: 2px solid #000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
